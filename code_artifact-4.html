<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปฏิทินบันทึกประจำวันสุดน่ารัก</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt / Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #ffeef8 0%, #fff4e6 50%, #e6f7ff 100%);
      min-height: 100vh;
    }
    .cute-shadow {
      box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.4), 0 8px 10px -6px rgba(255, 182, 193, 0.2);
    }
    .cute-badge {
      background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
      box-shadow: 0 4px 15px rgba(255, 154, 162, 0.25);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #fff0f5;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #ffb6c1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff9aa2;
    }
  </style>
</head>
<body class="py-8 px-4 flex flex-col items-center justify-start min-h-screen text-gray-700">

  <!-- Container หลัก -->
  <div class="w-full max-w-2xl mx-auto flex flex-col items-center">
    
    <!-- 2. Header Section -->
    <div class="text-center mb-8 w-full">
      <div class="inline-block cute-badge px-8 py-3 rounded-full border-2 border-pink-200 mb-3 transform hover:scale-105 transition-transform duration-300">
        <h1 class="text-2xl sm:text-3xl font-bold text-pink-500 flex items-center justify-center gap-2">
          ปฏิทินบันทึกประจำวันสุดน่ารัก <span class="text-yellow-400">✨</span> <span class="text-yellow-400">⭐</span>
        </h1>
      </div>
      <p class="text-gray-500 font-medium text-sm sm:text-base flex items-center justify-center gap-1">
        จัดการภารกิจส่วนตัวและงานในแต่ละวันอย่างมีความสุข <span class="text-pink-400">💕</span>
      </p>
    </div>

    <!-- 3. Calendar Container Card -->
    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 w-full cute-shadow border border-pink-100 mb-6">
      
      <!-- Month Header Nav -->
      <div class="border-2 border-pink-100 rounded-2xl p-4 mb-6 bg-pink-50/30 flex items-center justify-between">
        <button id="prev-month-btn" class="w-10 h-10 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-500 flex items-center justify-center text-lg font-bold transition-all hover:scale-110 active:scale-95">
          &lt;
        </button>
        
        <div class="text-center">
          <h2 id="month-year-title" class="text-xl sm:text-2xl font-bold text-gray-800">
            พฤศจิกายน 2569
          </h2>
          <button id="today-btn" class="mt-1 inline-flex items-center gap-1 text-xs sm:text-sm font-semibold text-pink-500 bg-pink-100/70 hover:bg-pink-200 px-3 py-1 rounded-full transition-all">
            📍 วันนี้ (<span id="today-date-text">4 พฤศจิกายน</span>)
          </button>
        </div>

        <button id="next-month-btn" class="w-10 h-10 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-500 flex items-center justify-center text-lg font-bold transition-all hover:scale-110 active:scale-95">
          &gt;
        </button>
      </div>

      <!-- Days of Week Header -->
      <div class="grid grid-cols-7 gap-2 mb-3 text-center font-bold text-sm sm:text-base">
        <div class="text-red-400 py-1">อา</div>
        <div class="text-gray-600 py-1">จ</div>
        <div class="text-pink-400 py-1">อ</div>
        <div class="text-emerald-500 py-1">พ</div>
        <div class="text-orange-400 py-1">พฤ</div>
        <div class="text-sky-400 py-1">ศ</div>
        <div class="text-purple-400 py-1">ส</div>
      </div>

      <!-- Calendar Grid (Dates) -->
      <div id="calendar-days-grid" class="grid grid-cols-7 gap-2">
        <!-- JS Dynamic Days -->
      </div>
    </div>

  </div>

  <!-- Modal สำหรับจัดการ To-Do List ของวันที่เลือก -->
  <div id="task-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4 transition-opacity">
    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-md cute-shadow border-2 border-pink-200 transform transition-all">
      
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-pink-100">
        <div>
          <h3 id="modal-date-title" class="text-xl font-bold text-gray-800">สิ่งที่ต้องทำ</h3>
          <p id="modal-date-subtitle" class="text-xs text-pink-400 font-medium">จัดการภารกิจวันนี้นะคะ ✨</p>
        </div>
        <button id="close-modal-btn" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-pink-100 text-gray-400 hover:text-pink-500 flex items-center justify-center font-bold transition-colors">
          ✕
        </button>
      </div>

      <!-- Form สำหรับเพิ่มงานใหม่ -->
      <form id="add-task-form" class="flex gap-2 mb-5">
        <input 
          type="text" 
          id="task-input" 
          placeholder="เพิ่มสิ่งที่ต้องทำ..." 
          class="flex-1 px-4 py-2.5 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/20"
          required
        >
        <button 
          type="submit" 
          class="bg-pink-400 hover:bg-pink-500 text-white font-medium px-4 py-2.5 rounded-xl transition-all shadow-md hover:shadow-lg active:scale-95 text-sm flex items-center gap-1"
        >
          <span>➕</span> เพิ่ม
        </button>
      </form>

      <!-- รายการ สิ่งที่ต้องทำ -->
      <div class="max-h-60 overflow-y-auto pr-1">
        <ul id="task-list" class="space-y-2.5">
          <!-- JS Dynamic Tasks -->
        </ul>
        <div id="empty-state" class="text-center py-8 text-gray-400 text-sm hidden">
          <p class="text-3xl mb-1">🌸</p>
          <p>ยังไม่มีรายการบันทึกในวันนี้</p>
          <p class="text-xs text-gray-300">ลองเพิ่มกิจกรรมใหม่ดูนะ!</p>
        </div>
      </div>

      <!-- Footer Modal -->
      <div class="mt-6 pt-3 border-t border-gray-100 flex justify-end">
        <button id="done-modal-btn" class="bg-gradient-to-r from-pink-400 to-rose-400 text-white font-semibold px-6 py-2 rounded-xl text-sm shadow-md hover:opacity-90 transition-all">
          เสร็จสิ้น 💖
        </button>
      </div>
    </div>
  </div>

  <script>
    // ชื่อเดือนภาษาไทย
    const MONTH_NAMES_TH = [
      "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
      "กรกฎาคม", "สิงหาคม", "กันยายน", "ตลุาคม", "พฤศจิกายน", "ธันวาคม"
    ];

    // กำหนดวันที่ปัจจุบันเริ่มต้นตามโจทย์: พฤศจิกายน 2569 (ค.ศ. 2026) วันที่ 4
    // สามารถซิงค์กับวันที่จริงของเครื่องได้หากไม่ได้ fix ปีไว้
    let currentDate = new Date(2026, 10, 4); // พฤศจิกายน = Index 10
    const today = new Date(2026, 10, 4);      // วันนี้อ้างอิง: 4 พฤศจิกายน 2569

    let selectedDateKey = ""; // รูปแบบ YYYY-MM-DD สำหรับ LocalStorage

    // DOM Elements
    const monthYearTitle = document.getElementById('month-year-title');
    const todayDateText = document.getElementById('today-date-text');
    const calendarDaysGrid = document.getElementById('calendar-days-grid');
    const prevMonthBtn = document.getElementById('prev-month-btn');
    const nextMonthBtn = document.getElementById('next-month-btn');
    const todayBtn = document.getElementById('today-btn');

    // Modal Elements
    const taskModal = document.getElementById('task-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const doneModalBtn = document.getElementById('done-modal-btn');
    const modalDateTitle = document.getElementById('modal-date-title');
    const modalDateSubtitle = document.getElementById('modal-date-subtitle');
    const addTaskForm = document.getElementById('add-task-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');

    // LocalStorage Helpers
    function getTasksFromStorage() {
      const data = localStorage.getItem('cute_calendar_tasks');
      return data ? JSON.parse(data) : {};
    }

    function saveTasksToStorage(tasks) {
      localStorage.setItem('cute_calendar_tasks', JSON.stringify(tasks));
    }

    // แปลง ค.ศ. เป็น พ.ศ.
    function toThaiYear(year) {
      return year + 543;
    }

    // สร้าง Key สำหรับบันทึกใน LocalStorage (YYYY-MM-DD)
    function formatDateKey(year, month, day) {
      const m = String(month + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }

    // เรนเดอร์ปฏิทิน
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // แสดงชื่อเดือนและปี พ.ศ.
      monthYearTitle.textContent = `${MONTH_NAMES_TH[month]} ${toThaiYear(year)}`;
      todayDateText.textContent = `${today.getDate()} ${MONTH_NAMES_TH[today.getMonth()]}`;

      // เคลียร์ปฏิทินเดิม
      calendarDaysGrid.innerHTML = '';

      // หาวันแรกของเดือน (0 = อาทิตย์, 1 = จันทร์, ...)
      const firstDayIndex = new Date(year, month, 1).getDay();
      // จำนวนวันในเดือนปัจจุบัน
      const totalDaysInMonth = new Date(year, month + 1, 0).getDate();

      // ดึงรายการงานเพื่อแสดงจุดแจ้งเตือนว่ามีงานค้างไหม
      const allTasks = getTasksFromStorage();

      // เติมช่องว่างด้านหน้า (สำหรับวันของเดือนก่อนหน้า)
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'h-12 sm:h-16 rounded-2xl bg-transparent';
        calendarDaysGrid.appendChild(emptyCell);
      }

      // เติมวันในเดือน
      for (let day = 1; day <= totalDaysInMonth; day++) {
        const dateKey = formatDateKey(year, month, day);
        const dayBtn = document.createElement('button');
        
        // ตรวจสอบว่าเป็น "วันนี้" หรือไม่ (ในรูปคือวันที่ 4 พฤศจิกายน 2569)
        const isToday = (day === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        
        // เช็คว่ามี Task ในวันนี้หรือไม่
        const dayTasks = allTasks[dateKey] || [];
        const hasTasks = dayTasks.length > 0;
        const hasPending = dayTasks.some(t => !t.completed);

        // ตกแต่งปุ่มวันที่ตามดีไซน์
        let baseStyle = "h-12 sm:h-16 rounded-2xl border flex flex-col items-center justify-center transition-all duration-200 relative group font-semibold text-sm sm:text-base cursor-pointer ";
        
        if (isToday) {
          // ไฮไลท์สีชมพูพาสเทลสวยงามเหมือนในรูปภาพ
          baseStyle += "bg-pink-300/80 border-pink-400 text-white shadow-md shadow-pink-200 font-bold scale-105 z-10 hover:bg-pink-400";
        } else {
          baseStyle += "bg-white border-pink-100/60 text-gray-700 hover:border-pink-300 hover:bg-pink-50/50 shadow-sm";
        }

        dayBtn.className = baseStyle;
        
        // โครงสร้าง HTML ภายในช่องวัน
        let innerHTML = `<span>${day}</span>`;
        
        // จุดแจ้งเตือนกิจกรรม
        if (hasTasks) {
          const dotColor = isToday ? 'bg-white' : (hasPending ? 'bg-pink-400' : 'bg-emerald-400');
          innerHTML += `<span class="w-1.5 h-1.5 rounded-full ${dotColor} absolute bottom-1.5 sm:bottom-2"></span>`;
        }

        dayBtn.innerHTML = innerHTML;

        // เมื่อคลิกวันที่ -> เปิด Modal บันทึก To-Do List
        dayBtn.addEventListener('click', () => {
          openTaskModal(year, month, day);
        });

        calendarDaysGrid.appendChild(dayBtn);
      }
    }

    // จัดการเปลี่ยนเดือน
    prevMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    todayBtn.addEventListener('click', () => {
      currentDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      renderCalendar();
    });

    // ================= MODAL & TASK LOGIC =================

    function openTaskModal(year, month, day) {
      selectedDateKey = formatDateKey(year, month, day);
      const formattedDateTH = `${day} ${MONTH_NAMES_TH[month]} ${toThaiYear(year)}`;
      modalDateTitle.textContent = `สิ่งที่ต้องทำ (${day} ${MONTH_NAMES_TH[month]})`;
      modalDateSubtitle.textContent = `รายการสำหรับวันที่ ${formattedDateTH}`;

      renderTaskList();
      taskModal.classList.remove('hidden');
    }

    function closeModal() {
      taskModal.classList.add('hidden');
      taskInput.value = '';
      renderCalendar(); // อัปเดตจุดสถานะปฏิทิน
    }

    closeModalBtn.addEventListener('click', closeModal);
    doneModalBtn.addEventListener('click', closeModal);
    taskModal.addEventListener('click', (e) => {
      if (e.target === taskModal) closeModal();
    });

    // แสดงรายการงานสำหรับวันที่เลือก
    function renderTaskList() {
      const allTasks = getTasksFromStorage();
      const tasks = allTasks[selectedDateKey] || [];
      
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        tasks.forEach((task, index) => {
          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-3 rounded-2xl border transition-all ${
            task.completed 
              ? 'bg-gray-50 border-gray-200 text-gray-400 line-through' 
              : 'bg-pink-50/40 border-pink-100 text-gray-700'
          }`;

          li.innerHTML = `
            <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0 pr-2">
              <input 
                type="checkbox" 
                ${task.completed ? 'checked' : ''} 
                onchange="toggleTask(${index})"
                class="w-4 h-4 text-pink-400 rounded focus:ring-pink-300 accent-pink-400 cursor-pointer"
              >
              <span class="truncate text-sm font-medium">${escapeHtml(task.text)}</span>
            </label>
            <button 
              onclick="deleteTask(${index})" 
              class="text-gray-300 hover:text-red-400 p-1 transition-colors text-sm rounded-lg hover:bg-red-50"
              title="ลบ"
            >
              🗑️
            </button>
          `;
          taskList.appendChild(li);
        });
      }
    }

    // เพิ่มงานใหม่
    addTaskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      const allTasks = getTasksFromStorage();
      if (!allTasks[selectedDateKey]) {
        allTasks[selectedDateKey] = [];
      }

      allTasks[selectedDateKey].push({
        text: text,
        completed: false
      });

      saveTasksToStorage(allTasks);
      taskInput.value = '';
      renderTaskList();
    });

    // สลับสถานะ เสร็จ/ยังไม่เสร็จ (Global function เพื่อใช้อ้างอิงใน inline HTML)
    window.toggleTask = function(index) {
      const allTasks = getTasksFromStorage();
      if (allTasks[selectedDateKey] && allTasks[selectedDateKey][index]) {
        allTasks[selectedDateKey][index].completed = !allTasks[selectedDateKey][index].completed;
        saveTasksToStorage(allTasks);
        renderTaskList();
      }

    };

    // ลบรายการงาน
    window.deleteTask = function(index) {
      const allTasks = getTasksFromStorage();
      if (allTasks[selectedDateKey]) {
        allTasks[selectedDateKey].splice(index, 1);
        if (allTasks[selectedDateKey].length === 0) {
          delete allTasks[selectedDateKey];
        }
        saveTasksToStorage(allTasks);
        renderTaskList();
      }
    };

    // ป้องกัน XSS
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // เริ่มต้นแสดงผลปฏิทิน
    window.onload = function() {
      renderCalendar();
    };
  </script>
</body>
</html>
