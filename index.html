<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินบันทึกประจำวันสุดน่ารัก</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit & Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            pink: '#FFD1DC',
                            lightpink: '#FFF0F5',
                            yellow: '#FFF3CD',
                            blue: '#D4F1F9',
                            purple: '#E6E6FA',
                            peach: '#FFE5B4',
                            main: '#FF85A1',
                            accent: '#FF688B'
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFF5F7;
            background-image: radial-gradient(#FFD1DC 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .calendar-card {
            box-shadow: 0 10px 25px -5px rgba(255, 133, 161, 0.2), 0 8px 10px -6px rgba(255, 133, 161, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #FFF0F5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #FFB6C1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="font-sans text-gray-700 min-h-screen pb-12">

    <!-- Header Section -->
    <header class="text-center py-8 px-4">
        <div class="inline-block bg-white px-8 py-4 rounded-full shadow-md border-2 border-pastel-pink transform -rotate-1 transition hover:rotate-0">
            <h1 class="text-2xl md:text-3xl font-bold text-pastel-accent flex items-center justify-center gap-2">
                <span>✨</span> ปฏิทิน & ไดอารี่สุดน่ารัก <span>💖</span>
            </h1>
            <p class="text-xs md:text-sm text-gray-500 mt-1">บันทึกสิ่งที่ต้องทำ ไดอารี่ และความรู้สึกประจำวัน</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4">
        <div class="bg-white rounded-3xl p-6 md:p-8 calendar-card border-4 border-pastel-lightpink">
            
            <!-- Calendar Navigation -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b-2 border-dashed border-pastel-pink">
                <button id="prev-month" class="p-2 md:px-4 md:py-2 bg-pastel-lightpink hover:bg-pastel-pink text-pastel-accent rounded-2xl transition flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span class="hidden md:inline">เดือนก่อนหน้า</span>
                </button>
                
                <h2 id="current-month-year" class="text-xl md:text-2xl font-bold text-gray-700"></h2>
                
                <button id="next-month" class="p-2 md:px-4 md:py-2 bg-pastel-lightpink hover:bg-pastel-pink text-pastel-accent rounded-2xl transition flex items-center gap-1 font-medium">
                    <span class="hidden md:inline">เดือนถัดไป</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Days of Week Header -->
            <div class="grid grid-cols-7 gap-1 md:gap-2 mb-2 text-center font-bold text-gray-500 text-sm md:text-base">
                <div class="text-red-400 py-2">อา.</div>
                <div class="py-2">จ.</div>
                <div class="py-2">อ.</div>
                <div class="py-2">พ.</div>
                <div class="py-2">พฤ.</div>
                <div class="py-2">ศ.</div>
                <div class="text-blue-400 py-2">ส.</div>
            </div>

            <!-- Calendar Days Grid -->
            <div id="calendar-days" class="grid grid-cols-7 gap-1 md:gap-2 text-center"></div>
        </div>
    </main>

    <!-- Modal for Daily Log (Tasks + Mood + Diary + Photo) -->
    <div id="task-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-hidden shadow-2xl border-4 border-pastel-pink flex flex-col transform transition-all scale-95 opacity-0 duration-200" id="modal-content">
            
            <!-- Modal Header -->
            <div class="bg-pastel-lightpink p-4 md:p-5 flex justify-between items-center border-b border-pastel-pink">
                <div>
                    <h3 id="modal-date-title" class="text-lg md:text-xl font-bold text-pastel-accent"></h3>
                    <p class="text-xs text-gray-500">บันทึกกิจกรรม ไดอารี่ และอารมณ์ของคุณ</p>
                </div>
                <button id="close-modal" class="w-8 h-8 bg-white text-gray-400 hover:text-pastel-accent rounded-full flex items-center justify-center shadow transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div class="p-4 md:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-5">
                
                <!-- Mood Tracker Section -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fa-solid fa-face-smile text-pastel-main mr-1"></i> ความรู้สึกวันนี้ (Mood)
                    </label>
                    <div class="flex justify-between bg-pastel-lightpink/50 p-2 rounded-2xl border border-pastel-pink/50" id="mood-selector">
                        <button type="button" data-mood="happy" class="mood-btn flex-1 py-1.5 rounded-xl text-xl hover:bg-white transition text-center" title="มีความสุข">💖</button>
                        <button type="button" data-mood="good" class="mood-btn flex-1 py-1.5 rounded-xl text-xl hover:bg-white transition text-center" title="อารมณ์ดี">😊</button>
                        <button type="button" data-mood="neutral" class="mood-btn flex-1 py-1.5 rounded-xl text-xl hover:bg-white transition text-center" title="เฉยๆ">😐</button>
                        <button type="button" data-mood="sad" class="mood-btn flex-1 py-1.5 rounded-xl text-xl hover:bg-white transition text-center" title="เศร้า">😢</button>
                        <button type="button" data-mood="tired" class="mood-btn flex-1 py-1.5 rounded-xl text-xl hover:bg-white transition text-center" title="เหนื่อย/เครียด">😤</button>
                    </div>
                </div>

                <!-- Diary Section -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fa-solid fa-book-open text-pastel-main mr-1"></i> ไดอารี่ประจำวัน (Diary)
                    </label>
                    <textarea id="diary-input" rows="3" placeholder="เขียนบันทึกเรื่องราวหรือเรื่องน่ารักๆ ของวันนี้..." class="w-full px-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-pastel-main transition resize-none"></textarea>
                </div>

                <!-- Photo Upload Section -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fa-solid fa-image text-pastel-main mr-1"></i> รูปภาพความทรงจำ
                    </label>
                    <div class="space-y-2">
                        <div id="photo-preview-container" class="relative hidden rounded-2xl overflow-hidden border-2 border-pastel-pink max-h-48 bg-gray-50 flex items-center justify-center">
                            <img id="photo-preview" src="" alt="Daily photo" class="object-cover w-full h-full">
                            <button id="remove-photo-btn" class="absolute top-2 right-2 bg-red-500/80 hover:bg-red-500 text-white w-7 h-7 rounded-full flex items-center justify-center transition shadow">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                        <input type="file" id="photo-input" accept="image/*" class="hidden">
                        <button id="trigger-photo-btn" class="w-full py-2 px-3 border-2 border-dashed border-pastel-pink hover:bg-pastel-lightpink text-pastel-accent text-xs font-medium rounded-2xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-camera"></i>
                            <span>อัปโหลดรูปภาพประจำวัน</span>
                        </button>
                    </div>
                </div>

                <!-- Task Category Tabs -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fa-solid fa-list-check text-pastel-main mr-1"></i> สิ่งที่ต้องทำ (To-Do List)
                    </label>
                    <div class="flex bg-gray-100 p-1 rounded-2xl mb-3">
                        <button id="tab-personal" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-pastel-accent bg-white shadow-sm">
                            🏠 งานส่วนตัว
                        </button>
                        <button id="tab-work" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-gray-500 hover:text-gray-700">
                            🏫 งานโรงเรียน/อาชีพ
                        </button>
                    </div>

                    <!-- Task Input -->
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="task-input" placeholder="เพิ่มรายการใหม่..." class="flex-1 px-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-pastel-main transition">
                        <button id="add-task-btn" class="px-4 py-2 bg-pastel-main hover:bg-pastel-accent text-white font-medium rounded-2xl transition text-sm flex items-center gap-1 shadow">
                            <i class="fa-solid fa-plus"></i> เพิ่ม
                        </button>
                    </div>

                    <!-- Task Lists -->
                    <div id="personal-tasks-container" class="space-y-2 max-h-36 overflow-y-auto custom-scrollbar"></div>
                    <div id="work-tasks-container" class="space-y-2 max-h-36 overflow-y-auto custom-scrollbar hidden"></div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="bg-gray-50 p-3 px-6 border-t border-gray-100 text-right">
                <button id="save-all-btn" class="px-6 py-2 bg-pastel-main hover:bg-pastel-accent text-white font-semibold rounded-2xl transition shadow">
                    บันทึกทั้งหมด 💖
                </button>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const monthNames = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];

        const moodEmojis = {
            happy: "💖",
            good: "😊",
            neutral: "😐",
            sad: "😢",
            tired: "😤"
        };

        let currentDate = new Date();
        let selectedDateKey = '';
        let currentTab = 'personal'; 
        let tempPhotoData = '';
        
        let appData = JSON.parse(localStorage.getItem('cute_calendar_app_data')) || {};

        const calendarDays = document.getElementById('calendar-days');
        const currentMonthYear = document.getElementById('current-month-year');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        
        const taskModal = document.getElementById('task-modal');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal');
        const modalDateTitle = document.getElementById('modal-date-title');
        
        const diaryInput = document.getElementById('diary-input');
        const photoInput = document.getElementById('photo-input');
        const photoPreview = document.getElementById('photo-preview');
        const photoPreviewContainer = document.getElementById('photo-preview-container');
        const triggerPhotoBtn = document.getElementById('trigger-photo-btn');
        const removePhotoBtn = document.getElementById('remove-photo-btn');
        
        const taskInput = document.getElementById('task-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const personalTasksContainer = document.getElementById('personal-tasks-container');
        const workTasksContainer = document.getElementById('work-tasks-container');
        const tabPersonal = document.getElementById('tab-personal');
        const tabWork = document.getElementById('tab-work');
        const saveAllBtn = document.getElementById('save-all-btn');

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            currentMonthYear.textContent = `${monthNames[month]} ${year + 543}`;
            calendarDays.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'h-16 md:h-24 bg-transparent';
                calendarDays.appendChild(emptyDiv);
            }

            for (let date = 1; date <= lastDate; date++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                const dayData = appData[dateKey] || { personalTasks: [], workTasks: [], mood: '', diary: '', photo: '' };
                
                const isToday = today.getDate() === date && 
                                today.getMonth() === month && 
                                today.getFullYear() === year;

                const daySquare = document.createElement('div');
                daySquare.className = `h-16 md:h-24 p-1 rounded-2xl border transition cursor-pointer flex flex-col justify-between relative group ${
                    isToday 
                        ? 'bg-pastel-lightpink border-pastel-main shadow-inner font-bold' 
                        : 'bg-white border-gray-100 hover:border-pastel-pink hover:bg-pastel-lightpink/30'
                }`;

                const hasPersonalUnfinished = dayData.personalTasks.some(t => !t.completed);
                const hasWorkUnfinished = dayData.workTasks.some(t => !t.completed);

                daySquare.innerHTML = `
                    <div class="flex justify-between items-center w-full px-1">
                        <span class="text-xs md:text-sm ${isToday ? 'text-pastel-accent font-extrabold' : 'text-gray-700'}">${date}</span>
                        <span class="text-xs md:text-sm">${dayData.mood ? moodEmojis[dayData.mood] : ''}</span>
                    </div>
                    
                    <div class="flex-1 flex flex-col justify-center items-center gap-0.5 my-1">
                        ${dayData.photo ? '<span class="text-xs text-pastel-main"><i class="fa-solid fa-image"></i></span>' : ''}
                        ${dayData.diary ? '<span class="text-[10px] text-gray-400 max-w-full truncate px-1">📝</span>' : ''}
                    </div>

                    <div class="flex justify-center gap-1 w-full pb-0.5">
                        ${hasPersonalUnfinished ? '<span class="w-1.5 h-1.5 rounded-full bg-pastel-main" title="งานส่วนตัว"></span>' : ''}
                        ${hasWorkUnfinished ? '<span class="w-1.5 h-1.5 rounded-full bg-blue-400" title="งานโรงเรียน"></span>' : ''}
                    </div>
                `;

                daySquare.addEventListener('click', () => openModal(dateKey, date, month, year));
                calendarDays.appendChild(daySquare);
            }
        }

        function openModal(dateKey, date, month, year) {
            selectedDateKey = dateKey;
            modalDateTitle.textContent = `วันที่ ${date} ${monthNames[month]} ${year + 543}`;
            
            if (!appData[selectedDateKey]) {
                appData[selectedDateKey] = { personalTasks: [], workTasks: [], mood: '', diary: '', photo: '' };
            }

            const dayData = appData[selectedDateKey];

            // Set Mood
            document.querySelectorAll('.mood-btn').forEach(btn => {
                if (btn.dataset.mood === dayData.mood) {
                    btn.classList.add('bg-white', 'shadow-sm', 'scale-110');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'scale-110');
                }
            });

            // Set Diary
            diaryInput.value = dayData.diary || '';

            // Set Photo
            tempPhotoData = dayData.photo || '';
            if (tempPhotoData) {
                photoPreview.src = tempPhotoData;
                photoPreviewContainer.classList.remove('hidden');
            } else {
                photoPreviewContainer.classList.add('hidden');
            }

            switchTab('personal');
            renderTasks();

            taskModal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                taskModal.classList.add('hidden');
            }, 200);
        }

        // Photo Upload Handling
        triggerPhotoBtn.addEventListener('click', () => photoInput.click());

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    tempPhotoData = event.target.result;
                    photoPreview.src = tempPhotoData;
                    photoPreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        removePhotoBtn.addEventListener('click', () => {
            tempPhotoData = '';
            photoPreview.src = '';
            photoPreviewContainer.classList.add('hidden');
            photoInput.value = '';
        });

        // Mood Selection
        document.getElementById('mood-selector').addEventListener('click', (e) => {
            const btn = e.target.closest('.mood-btn');
            if (!btn) return;
            
            const selectedMood = btn.dataset.mood;
            appData[selectedDateKey].mood = appData[selectedDateKey].mood === selectedMood ? '' : selectedMood;
            
            document.querySelectorAll('.mood-btn').forEach(b => {
                if (b.dataset.mood === appData[selectedDateKey].mood) {
                    b.classList.add('bg-white', 'shadow-sm', 'scale-110');
                } else {
                    b.classList.remove('bg-white', 'shadow-sm', 'scale-110');
                }
            });
        });

        // Tab Switching
        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'personal') {
                tabPersonal.className = 'flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-pastel-accent bg-white shadow-sm';
                tabWork.className = 'flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-gray-500 hover:text-gray-700';
                personalTasksContainer.classList.remove('hidden');
                workTasksContainer.classList.add('hidden');
            } else {
                tabWork.className = 'flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-blue-500 bg-white shadow-sm';
                tabPersonal.className = 'flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-gray-500 hover:text-gray-700';
                workTasksContainer.classList.remove('hidden');
                personalTasksContainer.classList.add('hidden');
            }
        }

        tabPersonal.addEventListener('click', () => switchTab('personal'));
        tabWork.addEventListener('click', () => switchTab('work'));

        // Task Functions
        function renderTasks() {
            const dayData = appData[selectedDateKey];
            
            // Personal
            personalTasksContainer.innerHTML = '';
            dayData.personalTasks.forEach((task, index) => {
                personalTasksContainer.appendChild(createTaskElement(task, index, 'personalTasks'));
            });

            // Work
            workTasksContainer.innerHTML = '';
            dayData.workTasks.forEach((task, index) => {
                workTasksContainer.appendChild(createTaskElement(task, index, 'workTasks'));
            });
        }

        function createTaskElement(task, index, type) {
            const div = document.createElement('div');
            div.className = 'flex items-center justify-between p-2 rounded-xl bg-gray-50 border border-gray-100 text-xs';
            div.innerHTML = `
                <div class="flex items-center gap-2 flex-1">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} class="w-4 h-4 accent-pastel-main rounded cursor-pointer">
                    <span class="${task.completed ? 'line-through text-gray-400' : 'text-gray-700'}">${task.text}</span>
                </div>
                <button class="text-gray-300 hover:text-red-400 transition p-1">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;

            div.querySelector('input').addEventListener('change', () => {
                appData[selectedDateKey][type][index].completed = !appData[selectedDateKey][type][index].completed;
                renderTasks();
            });

            div.querySelector('button').addEventListener('click', () => {
                appData[selectedDateKey][type].splice(index, 1);
                renderTasks();
            });

            return div;
        }

        addTaskBtn.addEventListener('click', () => {
            const text = taskInput.value.trim();
            if (!text) return;
            const type = currentTab === 'personal' ? 'personalTasks' : 'workTasks';
            appData[selectedDateKey][type].push({ text, completed: false });
            taskInput.value = '';
            renderTasks();
        });

        // Save All
        saveAllBtn.addEventListener('click', () => {
            appData[selectedDateKey].diary = diaryInput.value.trim();
            appData[selectedDateKey].photo = tempPhotoData;
            localStorage.setItem('cute_calendar_app_data', JSON.stringify(appData));
            closeModal();
            renderCalendar();
        });

        // Navigation
        prevMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        closeModalBtn.addEventListener('click', closeModal);

        // Initial Render
        renderCalendar();
    </script>
</body>
</html>
